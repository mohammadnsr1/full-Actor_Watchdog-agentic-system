name: ur5e_rg2_cell
robot: UR5e (simulated; UR7e on the hardware platform) with an OnRobot RG2
mount: {parent_frame: world, child_frame: base_link}
frames: {world: world, base: base_link, flange: wrist_3_link, tcp: tcp, tcp_note: fixed frame on the gripper (URDF);
