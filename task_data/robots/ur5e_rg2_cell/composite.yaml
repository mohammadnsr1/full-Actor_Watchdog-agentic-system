joints:
  arm: [shoulder_pan_joint, shoulder_lift_joint, elbow_joint, wrist_1_joint, wrist_2_joint, wrist_3_joint]
  gripper: finger_joint
  gripper_note: the RG2's one actuated joint; the other finger joints mimic it
home_joint_positions: {shoulder_pan_joint: 0.0, shoulder_lift_joint: -1.5708, elbow_joint: 1.5708, wrist_1_joint: -1.5708,
